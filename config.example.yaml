# Mintlify → OpenAI gateway (CLIProxyAPI SDK)
#
# Exposes OpenAI-compatible endpoints with Mintlify prompt-tool translation:
#   POST /v1/chat/completions   (stream tool_calls + content)
#   POST /v1/responses          (function_call output items + message)
# Model: claude-docs
#
# Client tools are injected as text protocol (Mintlify has no native tools API).
# Mintlify server-side search is swallowed; only client <tool_call> markers surface.
#
# Copy to config.yaml and adjust api-keys before running:
#   cp config.example.yaml config.yaml
#   go run . config.yaml

host: "127.0.0.1"
port: 8317

# Outbound proxy for Mintlify TLS client (socks5:// / http://)
# IMPORTANT: Mintlify returns 418 for many VPN/datacenter exits
# ("unavailable from your network"). Prefer empty (direct) or a clean
# residential egress. Do NOT use known-blocked exits such as
# socks5://100.74.21.88:7890 (verified 418 on leaves.mintlify.com).
proxy-url: ""

# Project-local auth dir (mintlify auth is runtime_only; keep this empty of other providers)
auth-dir: "./auths"

# Bearer tokens accepted by /v1/* endpoints
api-keys:
  - "sk-mintlify-local"

debug: false

# Optional: disable management UI noise for local use
remote-management:
  allow-remote: false
  secret-key: ""
  disable-control-panel: true
