# Docs AI → OpenAI gateway (CLIProxyAPI SDK)
#
# Exposes OpenAI-compatible endpoints:
#   POST /v1/chat/completions
#   POST /v1/responses
#   GET  /v1/models
#
# Models (from docs-expert providers verified working):
#   claude-docs      Mintlify (code.claude.com)
#   anthropic-docs   Inkeep (platform.claude.com / Anthropic docs)
#   stripe-docs      Stripe docs AI (ai.stripe.com)
#   readme-docs      ReadMe Ask AI (docs.readme.com)
#
# Skipped (docs-expert CLI failed locally): vercel, fern, gitbook,
# better-auth, generic mintlify/inkeep auto-detect sites.
#
# Copy to config.yaml and adjust api-keys before running:
#   cp config.example.yaml config.yaml
#   go run . config.yaml

host: "127.0.0.1"
port: 8317

# Outbound proxy for all docs providers (socks5:// / http:// / https://)
# Also supports "direct"/"none" to bypass env proxies.
# Mintlify returns 418 for many VPN/datacenter exits — leave empty or use a clean exit.
proxy-url: ""

# Project-local auth dir (runtime_only auths; keep empty of other providers)
auth-dir: "./auths"

# Bearer tokens accepted by /v1/* endpoints
api-keys:
  - "sk-mintlify-local"

debug: false

remote-management:
  allow-remote: false
  secret-key: ""
  disable-control-panel: true
