# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: docs-ai-reverse

before:
  hooks:
    - go mod tidy

builds:
  - id: docs-ai-reverse
    main: .
    binary: docs-ai-reverse
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.CommitDate}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - README.en.md
      - config.example.yaml

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^doc:"
      - "^chore:"
      - "^ci:"
      - "^test:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: 6Kmfi6HP
    name: docs-ai-reverse
  draft: false
  prerelease: auto
  name_template: "v{{ .Version }}"
  footer: |
    ## Docker

    ```bash
    docker pull ghcr.io/6kmfi6hp/docs-ai-reverse:{{ .Tag }}
    docker pull ghcr.io/6kmfi6hp/docs-ai-reverse:{{ .Version }}
    ```

    Multi-arch images (`linux/amd64`, `linux/arm64`) are published to GHCR by the release workflow.
    Mount a config with `host: "0.0.0.0"` to accept connections from outside the container.

    See [docs/ci-cd.md](https://github.com/6Kmfi6HP/docs-ai-reverse/blob/main/docs/ci-cd.md).
